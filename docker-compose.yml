services:
  postgres:
    image: postgres:17-alpine
    container_name: cms-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cms
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:8
    container_name: cms-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: cms

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cms-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/cms
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      - mongodb

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cms-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cms
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy

volumes:
  mongodb_data:
  postgres_data:
