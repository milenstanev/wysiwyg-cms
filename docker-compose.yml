services:
  mongodb:
    image: mongo:8
    container_name: cms-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: cms

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cms-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/cms
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      - mongodb

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cms-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/data/dev.db
    volumes:
      - web_data:/app/data
    depends_on:
      - api

volumes:
  mongodb_data:
